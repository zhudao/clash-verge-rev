name: Sync Fork

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  workflow: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork with upstream
        run: |
          gh repo sync ${{ github.repository }} \
            --source clash-verge-rev/clash-verge-rev \
            -b main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
