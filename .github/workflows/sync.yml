name: Sync Fork (自动获取上游)

on:
  schedule:
    - cron: '0 0 * * *'     # 每天 0 点同步
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync with upstream
        run: |
          gh repo sync ${{ github.repository }} \
            --source ${{ steps.get-upstream.outputs.upstream }} \
            -b main \
            --force
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}   # ← 使用 PAT 而不是 GITHUB_TOKEN
